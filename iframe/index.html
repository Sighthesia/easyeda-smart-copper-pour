<!doctype html>
<html lang="zh-Hans">
	<head>
		<title>智能铜皮生成</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/iframe/index.css" />
	</head>
	<body>
		<div class="main">
			<section>
				<h1>智能铜皮生成</h1>
				<div class="summary">
					<div><strong>网络</strong><span id="selection-net">加载中...</span></div>
					<div><strong>层</strong><span id="selection-layer">加载中...</span></div>
					<div><strong>节点</strong><span id="selection-pad-count">0</span></div>
				</div>
			</section>

			<form id="smart-copper-pour-form">
				<div class="grid">
					<div>
						<label for="topology-mode">拓扑模式</label>
						<select id="topology-mode" name="topologyMode">
							<option value="daisyChain" selected>树状</option>
							<option value="star">块状</option>
						</select>
					</div>
					<div data-star-only hidden>
						<label for="star-area-shape">块状区域</label>
						<select id="star-area-shape" name="starAreaShape">
							<option value="convexHull" selected>凸包</option>
							<option value="boundingBox">边界框</option>
						</select>
					</div>
					<div>
						<label for="corner-style">拐角样式</label>
						<select id="corner-style" name="cornerStyle">
							<option value="round">圆角</option>
							<option value="rightAngle">直角</option>
							<option value="bevel45" selected>45°斜切</option>
						</select>
					</div>
					<div>
						<label for="width">附加宽度</label>
						<input id="width" name="width" type="number" min="0.01" step="0.1" value="1" />
					</div>
					<div>
						<label for="keepout-margin">避让边距</label>
						<input id="keepout-margin" name="keepoutMargin" type="number" min="0" step="0.1" value="0" />
					</div>
					<div>
						<label for="use-node-size-as-base-width">节点尺寸作为基础宽度</label>
						<input id="use-node-size-as-base-width" name="useNodeSizeAsBaseWidth" type="checkbox" checked />
					</div>
					<div data-tree-like-only>
						<label for="orthogonal-routing">正交走向</label>
						<input id="orthogonal-routing" name="orthogonalRouting" type="checkbox" checked />
					</div>
				</div>
			</form>
		</div>

		<div class="footer">
			<div class="status" id="status-panel" data-tone="neutral">正在读取当前选区...</div>
			<div class="actions">
				<button type="button" id="preview-button">预览</button>
				<button type="button" id="apply-button">应用</button>
				<button type="button" id="clear-button">清除预览</button>
			</div>
		</div>

		<script src="/dist/iframe.js"></script>
	</body>
</html>
