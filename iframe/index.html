<!doctype html>
<html lang="zh-Hans">
	<head>
		<title>智能铜皮生成</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			:root {
				color-scheme: light;
				font-family: 'Segoe UI', sans-serif;
				line-height: 1.4;
			}

			body {
				margin: 0;
				padding: 16px;
				background: #f7f8fa;
				color: #1f2937;
			}

			form,
			section {
				background: #ffffff;
				border: 1px solid #d8dee8;
				border-radius: 8px;
				padding: 12px;
				margin-bottom: 12px;
			}

			h1 {
				font-size: 18px;
				margin: 0 0 12px;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
			}

			label {
				display: block;
				font-size: 12px;
				font-weight: 600;
				margin-bottom: 4px;
			}

			input,
			select,
			button {
				box-sizing: border-box;
				width: 100%;
				padding: 8px 10px;
				border-radius: 6px;
				border: 1px solid #c5cfdb;
				font: inherit;
				background: #ffffff;
			}

			button {
				cursor: pointer;
				font-weight: 600;
			}

			[data-daisy-only][hidden] {
				display: none;
			}

			.actions {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 8px;
				margin-top: 12px;
			}

			.status {
				min-height: 44px;
				font-size: 13px;
				padding: 10px;
				border-radius: 6px;
				background: #eef2f7;
			}

			.status[data-tone='error'] {
				background: #fdecec;
				color: #a12626;
			}

			.status[data-tone='success'] {
				background: #e8f7ea;
				color: #216e39;
			}

			.summary {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 8px;
				font-size: 13px;
			}

			.summary strong {
				display: block;
				font-size: 11px;
				color: #526071;
				margin-bottom: 2px;
			}

			@media (max-width: 520px) {
				.grid,
				.summary,
				.actions {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<section>
			<h1>智能铜皮生成</h1>
			<div class="summary">
				<div><strong>网络</strong><span id="selection-net">加载中...</span></div>
				<div><strong>层</strong><span id="selection-layer">加载中...</span></div>
				<div><strong>焊盘</strong><span id="selection-pad-count">0</span></div>
			</div>
		</section>

		<form id="smart-copper-pour-form">
			<div class="grid">
				<div>
					<label for="topology-mode">拓扑模式</label>
					<select id="topology-mode" name="topologyMode">
						<option value="tree">树形</option>
						<option value="star">星形</option>
						<option value="daisyChain">菊链</option>
					</select>
				</div>
				<div>
					<label for="corner-style">拐角样式</label>
					<select id="corner-style" name="cornerStyle">
						<option value="round">圆角</option>
						<option value="miter">斜接</option>
						<option value="bevel">斜切</option>
					</select>
				</div>
				<div>
					<label for="trunk-bias">主干偏置</label>
					<select id="trunk-bias" name="trunkBias">
						<option value="neutral">中性</option>
						<option value="horizontal">水平</option>
						<option value="vertical">垂直</option>
					</select>
				</div>
				<div>
					<label for="width">宽度</label>
					<input id="width" name="width" type="number" min="0.01" step="0.1" value="1" />
				</div>
				<div>
					<label for="keepout-margin">避让边距</label>
					<input id="keepout-margin" name="keepoutMargin" type="number" min="0" step="0.1" value="0" />
				</div>
				<div data-daisy-only hidden>
					<label for="trunk-start-x">主干起点 X</label>
					<input id="trunk-start-x" name="trunkStartX" type="number" step="0.1" value="0" />
				</div>
				<div data-daisy-only hidden>
					<label for="trunk-start-y">主干起点 Y</label>
					<input id="trunk-start-y" name="trunkStartY" type="number" step="0.1" value="0" />
				</div>
				<div data-daisy-only hidden>
					<label for="trunk-end-x">主干终点 X</label>
					<input id="trunk-end-x" name="trunkEndX" type="number" step="0.1" value="10" />
				</div>
				<div data-daisy-only hidden>
					<label for="trunk-end-y">主干终点 Y</label>
					<input id="trunk-end-y" name="trunkEndY" type="number" step="0.1" value="0" />
				</div>
			</div>
			<div class="actions">
				<button type="button" id="preview-button">预览</button>
				<button type="button" id="apply-button">应用</button>
				<button type="button" id="clear-button">清除</button>
			</div>
		</form>

		<section>
			<div class="status" id="status-panel" data-tone="neutral">等待选择摘要。</div>
		</section>

		<script>
			(() => {
				const REQUEST_TOPIC = 'smart-copper-pour/request';
				const RESPONSE_TOPIC = 'smart-copper-pour/response';
				const messageBus = window.parent?.eda?.sys_MessageBus ?? window.eda?.sys_MessageBus;
				const form = document.getElementById('smart-copper-pour-form');
				const previewButton = document.getElementById('preview-button');
				const applyButton = document.getElementById('apply-button');
				const clearButton = document.getElementById('clear-button');
				const statusPanel = document.getElementById('status-panel');
				const selectionNet = document.getElementById('selection-net');
				const selectionLayer = document.getElementById('selection-layer');
				const selectionPadCount = document.getElementById('selection-pad-count');
				const daisyOnlyFields = document.querySelectorAll('[data-daisy-only]');

				const setStatus = (message, tone = 'neutral') => {
					statusPanel.textContent = message;
					statusPanel.dataset.tone = tone;
				};

				const updateSelectionSummary = (payload) => {
					selectionNet.textContent = payload.netName ?? 'Unknown';
					selectionLayer.textContent = payload.layerName ?? 'Unknown';
					selectionPadCount.textContent = String(payload.padCount);
				};

				const readFormRequest = () => {
					const request = {
						topologyMode: form.topologyMode.value,
						cornerStyle: form.cornerStyle.value,
						trunkBias: form.trunkBias.value,
						width: Number(form.width.value),
						keepoutMargin: Number(form.keepoutMargin.value),
					};

					if (request.topologyMode === 'daisyChain') {
						request.trunkStart = {
							x: Number(form.trunkStartX.value),
							y: Number(form.trunkStartY.value),
						};
						request.trunkEnd = {
							x: Number(form.trunkEndX.value),
							y: Number(form.trunkEndY.value),
						};

						if (
							!Number.isFinite(request.trunkStart.x) ||
							!Number.isFinite(request.trunkStart.y) ||
							!Number.isFinite(request.trunkEnd.x) ||
							!Number.isFinite(request.trunkEnd.y)
						) {
							setStatus('菊链模式需要有效的主干坐标。', 'error');
							return null;
						}
					}

					if (!Number.isFinite(request.width) || request.width <= 0) {
						setStatus('宽度必须大于 0。', 'error');
						return null;
					}

					if (!Number.isFinite(request.keepoutMargin) || request.keepoutMargin < 0) {
						setStatus('避让边距必须大于等于 0。', 'error');
						return null;
					}

					return request;
				};

				const publishRequest = (message) => {
					if (!messageBus) {
						setStatus('当前 iframe 中无法访问 LCEDA 消息总线。', 'error');
						return;
					}

					messageBus.publish(REQUEST_TOPIC, message);
				};

				const syncModeVisibility = () => {
					const isDaisyChainMode = form.topologyMode.value === 'daisyChain';
					daisyOnlyFields.forEach((element) => {
						element.hidden = !isDaisyChainMode;
					});
				};

				const handlePreview = () => {
					const payload = readFormRequest();
					if (!payload) {
						return;
					}

					setStatus('正在生成预览...', 'neutral');
					publishRequest({ command: 'preview', payload });
				};

				const handleApply = () => {
					const payload = readFormRequest();
					if (!payload) {
						return;
					}

					setStatus('正在应用铜皮...', 'neutral');
					publishRequest({ command: 'apply', payload });
				};

				const handleClear = () => {
					setStatus('正在清除预览...', 'neutral');
					publishRequest({ command: 'clearPreview' });
				};

				const responseTask = messageBus?.subscribe(RESPONSE_TOPIC, (message) => {
					if (!message || typeof message !== 'object' || !('command' in message) || !('ok' in message)) {
						return;
					}

					if (message.ok === false) {
						setStatus(message.error?.message ?? '智能铜皮生成失败。', 'error');
						return;
					}

					switch (message.command) {
						case 'inspectSelection':
							updateSelectionSummary(message.payload);
							setStatus('已准备好选择。请调整参数后预览。', 'success');
							break;
						case 'preview':
							setStatus('预览已更新。', 'success');
							break;
						case 'apply':
							setStatus(message.payload.applied ? '铜皮已成功应用。' : '未生成铜皮。', 'success');
							break;
						case 'clearPreview':
							setStatus('预览已清除。', 'success');
							break;
						default:
							setStatus('收到未知的智能铜皮生成响应。', 'error');
					}
				});

				previewButton.addEventListener('click', handlePreview);
				applyButton.addEventListener('click', handleApply);
				clearButton.addEventListener('click', handleClear);
				form.topologyMode.addEventListener('change', syncModeVisibility);
				window.addEventListener('beforeunload', () => {
					responseTask?.cancel?.();
				});

				syncModeVisibility();
				publishRequest({ command: 'inspectSelection' });
			})();
		</script>
	</body>
</html>
